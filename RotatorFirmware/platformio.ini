[env:pico2]
platform = raspberrypi
board = rpipico2
framework = arduino
upload_port = COM3
monitor_speed = 19200
build_src_filter = +<main.cpp> -<blinky.cpp>
build_flags =
  -D __FREERTOS=1
lib_deps =
  gin66/FastAccelStepper@^0.31.4

[env:pico2_blinky]
platform = raspberrypi
board = rpipico2
framework = arduino
upload_port = COM3
monitor_speed = 19200
build_src_filter = +<blinky.cpp> -<main.cpp>
